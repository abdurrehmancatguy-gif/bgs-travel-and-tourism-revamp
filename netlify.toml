# The site is plain ES modules with no bundler, so this build does one thing:
# write the catalogue into the HTML before publishing. Everything else about the
# source tree is copied across untouched.
#
# It reads content from Firestore at build time over the public REST endpoint,
# so a content change needs a redeploy to reach the pre-rendered HTML. The
# browser still live-updates from Firestore, so visitors see edits immediately
# either way — it is only the crawler-visible copy that waits for a build.

[build]
  command = "node build/build.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed-by-version assets can be cached hard; HTML must not be, or an edit
# takes a day to show up.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The comment above was aspirational: no rule ever granted it, so Netlify's
# default applied and every asset came back "max-age=0, must-revalidate". A
# returning visitor was therefore re-validating all seven scene layers on every
# single load — seven round trips before the hero could paint, even when the
# answer was always 304 Not Modified.
#
# Safe to cache for a year because these URLs carry a revision: the scene layers
# are requested as ?rev=N (data/images.js) and everything else under /assets is
# either versioned or genuinely immutable. Change the pixels, change the rev.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Same reasoning for the modules and stylesheets, which already carry ?v=N and
# get that number bumped on every change.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/utils/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
